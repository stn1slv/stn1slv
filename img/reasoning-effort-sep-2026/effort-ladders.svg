<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-labelledby="t d">
  <title id="t">Rejections by reasoning effort, out of 198 articles</title>
  <desc id="d">At the relevance gate gpt-5.4-nano climbs from 30 rejections at effort none to 55 at medium, while gpt-5.6-luna stays flat at 66, 61 and 68. At the topic filter the same gpt-5.6-luna falls from 168 at none to 119 at high. gpt-5-nano, the retired model, rejected 20 at the relevance gate at its default effort.</desc>
  <style>
    .surface { fill: #fcfcfb; }
    .ink     { fill: #0b0b0b; }
    .sub     { fill: #52514e; }
    .muted   { fill: #898781; }
    .axis    { stroke: #c3c2b7; }
    .grid    { stroke: #c3c2b7; opacity: .55; }
    .s1      { stroke: #2a78d6; }  .s1f { fill: #2a78d6; }
    .s2      { stroke: #eb6834; }  .s2f { fill: #eb6834; }
    .s3      { stroke: #1baf7a; }  .s3f { fill: #1baf7a; }
    .dot     { stroke: #fcfcfb; stroke-width: 2; }
    text     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .line    { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink     { fill: #ffffff; }
      .sub     { fill: #c3c2b7; }
      .muted   { fill: #898781; }
      .axis    { stroke: #383835; }
      .grid    { stroke: #383835; opacity: .9; }
      .s1      { stroke: #3987e5; }  .s1f { fill: #3987e5; }
      .s2      { stroke: #d95926; }  .s2f { fill: #d95926; }
      .s3      { stroke: #199e70; }  .s3f { fill: #199e70; }
      .dot     { stroke: #1a1a19; }
    }
  </style>

  <rect class="surface" x="0" y="0" width="860" height="500"/>

  <text class="ink" x="24" y="30" font-size="17" font-weight="600">Reasoning effort does not move every model the same way</text>
  <text class="sub" x="24" y="50" font-size="13">Articles rejected out of 198, each step run on its own</text>

  <g font-size="12">
    <rect class="s1f" x="24" y="70" width="12" height="3" rx="1.5"/>
    <text class="sub" x="44" y="75">gpt-5.4-nano, relevance gate</text>
    <rect class="s2f" x="256" y="70" width="12" height="3" rx="1.5"/>
    <text class="sub" x="276" y="75">gpt-5.6-luna, relevance gate</text>
    <rect class="s3f" x="488" y="70" width="12" height="3" rx="1.5"/>
    <text class="sub" x="508" y="75">gpt-5.6-luna, topic filter</text>
  </g>

  <g class="grid" stroke-width="1">
    <line x1="160" y1="410" x2="600" y2="410"/>
    <line x1="160" y1="321.1" x2="600" y2="321.1"/>
    <line x1="160" y1="232.2" x2="600" y2="232.2"/>
    <line x1="160" y1="143.3" x2="600" y2="143.3"/>
  </g>
  <g class="muted" font-size="11" text-anchor="end">
    <text x="148" y="414">0</text>
    <text x="148" y="325">50</text>
    <text x="148" y="236">100</text>
    <text x="148" y="147">150</text>
  </g>
  <line class="axis" stroke-width="1" x1="160" y1="90" x2="160" y2="410"/>

  <g class="muted" font-size="12" text-anchor="middle">
    <text x="160" y="434">none</text>
    <text x="306.7" y="434">low</text>
    <text x="453.3" y="434">medium</text>
    <text x="600" y="434">high</text>
  </g>
  <text class="muted" x="380" y="458" font-size="11" text-anchor="middle">reasoning effort</text>

  <polyline class="line s3" points="160,111.3 306.7,159.3 453.3,180.7 600,198.4"/>
  <polyline class="line s2" points="160,292.7 306.7,301.6 453.3,289.1"/>
  <polyline class="line s1" points="160,356.7 453.3,312.2"/>

  <g class="dot">
    <circle class="s3f" cx="160" cy="111.3" r="4.5"/>
    <circle class="s3f" cx="306.7" cy="159.3" r="4.5"/>
    <circle class="s3f" cx="453.3" cy="180.7" r="4.5"/>
    <circle class="s3f" cx="600" cy="198.4" r="4.5"/>
    <circle class="s2f" cx="160" cy="292.7" r="4.5"/>
    <circle class="s2f" cx="306.7" cy="301.6" r="4.5"/>
    <circle class="s2f" cx="453.3" cy="289.1" r="4.5"/>
    <circle class="s1f" cx="160" cy="356.7" r="4.5"/>
    <circle class="s1f" cx="453.3" cy="312.2" r="4.5"/>
    <circle class="muted" cx="453.3" cy="374.4" r="4.5"/>
  </g>

  <g class="sub" font-size="11" text-anchor="middle">
    <text x="160" y="101">168</text>
    <text x="306.7" y="149">141</text>
    <text x="453.3" y="170">129</text>
    <text x="600" y="188">119</text>
    <text x="160" y="282">66</text>
    <text x="306.7" y="291">61</text>
    <text x="453.3" y="279">68</text>
    <text x="160" y="376">30</text>
    <text x="453.3" y="332">55</text>
  </g>

  <g font-size="12">
    <text class="s3f" x="614" y="202" font-weight="600">luna, topic filter</text>
    <text class="s3f" x="614" y="218" font-size="11" font-weight="400">still falling at high</text>
    <text class="s2f" x="470" y="264" font-weight="600">luna, relevance gate</text>
    <text class="s2f" x="470" y="280" font-size="11" font-weight="400">flat: 66, 61, 68</text>
    <text class="s1f" x="180" y="350" font-weight="600">gpt-5.4-nano</text>
    <text class="muted" x="470" y="378">gpt-5-nano, the retired model: 20</text>
  </g>

  <text class="muted" x="24" y="486" font-size="11">Points are the efforts I measured. A line between two points does not imply a reading in between.</text>
</svg>
